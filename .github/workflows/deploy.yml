name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run, e.g. after changing photos in the S3 bucket

# Never run two deploys at once.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # needed to request an AWS token through OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # No long-lived keys: GitHub exchanges its OIDC token for short-lived
      # credentials for the role in the AWS_ROLE_ARN secret. The build (photo
      # download), the S3 upload and the CloudFront invalidation all use them.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - run: npm ci

      - run: npm run build

      # Types for the GraphQL query are generated by the build, so check after it.
      - run: npm run typecheck

      - run: npx gatsby-plugin-s3 deploy --yes

      - run: npm run invalidate
